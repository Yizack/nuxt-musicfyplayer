name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          runtime: node@lts
          cache: true

      - run: pnpm config set registry https://registry.npmjs.org

      - name: 🚀 Publish package
        run: pnpm publish --access public --no-git-checks
